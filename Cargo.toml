[package]
name = "zfs-dedup"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Offline block-level deduplication for ZFS via FICLONERANGE"

[dependencies]
rustix = { version = "1", features = ["fs", "mount", "thread"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rayon = "1"
redb = "4"
jwalk = "0.9"
anyhow = "1"
lexopt = "0.3"
tempfile = "3"
mimalloc = "0.1.52"

[dev-dependencies]
divan = "0.1"

[[bench]]
name = "throughput"
harness = false
