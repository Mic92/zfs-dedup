[package]
name = "zfs-dedup"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Offline block-level deduplication for ZFS via FICLONERANGE"

[dependencies]
rustix = { version = "1", features = ["fs"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rayon = "1"
redb = "3"
jwalk = "0.8"
anyhow = "1"
lexopt = "0.3"

[dev-dependencies]
tempfile = "3"
